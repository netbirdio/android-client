name: build release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      application_id:
        description: 'Application ID to build under, e.g. io.netbird.client.private for a private Managed Google Play app. Leave empty for io.netbird.client.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    environment: android-release
    env:
      NETBIRD_UPLOAD_KEY_ALIAS: ${{ secrets.NETBIRD_UPLOAD_KEY_ALIAS }}
      NETBIRD_UPLOAD_KEY_PASSWORD: ${{ secrets.NETBIRD_UPLOAD_KEY_PASSWORD }}
      NETBIRD_UPLOAD_STORE_PASSWORD: ${{ secrets.NETBIRD_UPLOAD_STORE_PASSWORD }}
      NETBIRD_APPLICATION_ID: ${{ inputs.application_id }}
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      bundle_path: ${{ steps.build.outputs.bundle_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # git describe below needs the tags and the history down to the
          # nearest release tag; the default shallow clone carries neither.
          fetch-depth: 0
          submodules: recursive

      # A published release is named after its tag. A manual run is a snapshot:
      # its name reaches the management server as the peer's ui_version and is
      # shown on the app's about screen, so it has to say at a glance that this
      # build was signed and handed out rather than released. build-debug.yml
      # already claims the ci- prefix, and sharing it would make an unsigned PR
      # build and a signed hand-out indistinguishable in the peer list.
      # The snapshot tag is the nearest release tag in the commit's ancestry, so
      # once a new release is tagged, later snapshots pick it up on their own.
      # If describe finds no tag the step fails instead of minting a bare name.
      - name: Get version name
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION_NAME="$RELEASE_TAG"
          else
            BASE_TAG=$(git describe --tags --abbrev=0)
            SHORT_GIT_SHA=$(git rev-parse --short HEAD)
            VERSION_NAME="${BASE_TAG}-snapshot-${SHORT_GIT_SHA}"
          fi
          echo "Version name: $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # Releases and snapshots feed the same Play Store listing, so both run in
      # this one workflow and take their version code from its run number. That
      # number is handed to the run by GitHub and only ever grows, whichever
      # branch, tag or trigger started it; counting the runs the API still lists
      # does not, because old runs drop out of that list and the count shrinks.
      # Renaming this file resets the run number, which would send version codes
      # backwards. Re-running a run keeps its number, so a build that already
      # reached the Play Store has to be repeated as a new run.
      - name: Compute version code
        id: version_code
        run: |
          version_code=$((${{ github.run_number }} + 41))
          echo "Run number: ${{ github.run_number }} -> version_code=$version_code"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      # google-services.json only registers io.netbird.client; any other
      # application ID would fail the Google Services plugin, so those builds
      # go without Firebase.
      - name: Write google-services.json
        if: ${{ !inputs.application_id }}
        run: |
          echo "${{ secrets.GOOGLE_JSON }}" | base64 -d > app/google-services.json

      - name: Write keystore file
        run: |
          echo "${{ secrets.GPLAY_KEYSTORE }}" | base64 -d > gplay.keystore
          echo "NETBIRD_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/gplay.keystore" >> "$GITHUB_ENV"

      - name: Build Android
        id: build
        uses: ./.github/actions/build-android
        with:
          version_name: ${{ steps.version.outputs.version_name }}
          version_code: ${{ steps.version_code.outputs.version_code }}
          build_type: release

      - name: Upload files to existing release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.bundle_path }}
          tag_name: ${{ github.event.release.tag_name }}

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.version_name }}
          path: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.bundle_path }}
          retention-days: 14
