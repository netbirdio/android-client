name: build debug

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      bundle_path: ${{ steps.build.outputs.bundle_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get short Git hash
        id: version
        run: |
          SHORT_GIT_SHA=$(git rev-parse --short HEAD)
          echo "version_name=ci-${SHORT_GIT_SHA}" >> $GITHUB_OUTPUT

      - name: Build Android
        id: build
        uses: ./.github/actions/build-android
        with:
          version_name: ${{ steps.version.outputs.version_name }}
          build_type: debug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ steps.version.outputs.version_name }}
          path: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.bundle_path }}
          retention-days: 3

      - name: Upload AAR artifact for tests
        uses: actions/upload-artifact@v4
        with:
          name: netbird-aar
          path: ${{ steps.build.outputs.aar_path }}
          retention-days: 1

  unit-tests:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"
          cache: "gradle"

      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: netbird-aar
          path: gomobile

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            tool/build/reports/tests/
          retention-days: 3

  instrumented-tests:
    needs: build-debug
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: instrumentation-test-secrets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"
          cache: "gradle"

      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: netbird-aar
          path: gomobile

      - name: Verify required secrets
        env:
          INSTRUMENTATION_NB_SETUP_KEY: ${{ secrets.INSTRUMENTATION_NB_SETUP_KEY }}
        run: |
          if [ -z "$INSTRUMENTATION_NB_SETUP_KEY" ]; then
            echo "::error::INSTRUMENTATION_NB_SETUP_KEY repository secret is not configured"
            exit 1
          fi

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INSTRUMENTATION_NB_SETUP_KEY: ${{ secrets.INSTRUMENTATION_NB_SETUP_KEY }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disk-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: |
            set +e
            mkdir -p screen-recordings
            adb shell mkdir -p /sdcard/recordings

            # screenrecord caps each segment at 180s, so loop until we stop it.
            (
              i=0
              while [ -f /tmp/record_active ]; do
                seg=$(printf "seg_%03d.mp4" "$i")
                adb shell screenrecord --time-limit 180 --bit-rate 4000000 /sdcard/recordings/$seg
                i=$((i+1))
              done
            ) &
            REC_LOOP_PID=$!
            touch /tmp/record_active

            ./gradlew --no-daemon connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.notClass=io.netbird.client.NetworkConnectivityStressTest \
              -Pandroid.testInstrumentationRunnerArguments.setupKey="$INSTRUMENTATION_NB_SETUP_KEY"
            TEST_EXIT=$?

            rm -f /tmp/record_active
            adb shell pkill -SIGINT screenrecord 2>/dev/null || true
            wait $REC_LOOP_PID 2>/dev/null || true
            sleep 3
            adb pull /sdcard/recordings ./screen-recordings/ || true

            exit $TEST_EXIT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/
            tool/build/reports/androidTests/
          retention-days: 3

      - name: Upload screen recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-screen-recordings
          path: screen-recordings/
          if-no-files-found: warn
          retention-days: 3
